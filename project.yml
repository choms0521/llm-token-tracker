name: LLMTokenBar
options:
  bundleIdPrefix: com.llmtokenbar
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  LLMTokenBar:
    type: application
    platform: macOS
    sources:
      - path: LLMTokenBar
        excludes:
          - "**/*.entitlements"
    postBuildScripts:
      - script: |
          # Inject version from git tag into built Info.plist (e.g., v1.1.3 → 1.1.3)
          GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION="${GIT_TAG#v}"
          BUILD_NUMBER=$(git rev-list --count HEAD 2>/dev/null || echo "1")
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "$PLIST" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${VERSION}" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "$PLIST" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD_NUMBER}" "$PLIST"
          fi
        name: Set Version from Git Tag
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llmtokenbar.app
        INFOPLIST_FILE: LLMTokenBar/Info.plist
        CODE_SIGN_ENTITLEMENTS: LLMTokenBar/LLMTokenBar.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "YES"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        PRODUCT_NAME: "LLM Token Bar"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
  LLMTokenBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LLMTokenBarTests
    dependencies:
      - target: LLMTokenBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llmtokenbar.appTests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LLM Token Bar.app/Contents/MacOS/LLM Token Bar"
        BUNDLE_LOADER: "$(TEST_HOST)"
