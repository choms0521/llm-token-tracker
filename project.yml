name: LLMTokenBar
options:
  bundleIdPrefix: com.llmtokenbar
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  LLMTokenBar:
    type: application
    platform: macOS
    sources:
      - path: LLMTokenBar
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llmtokenbar.app
        INFOPLIST_FILE: LLMTokenBar/Info.plist
        CODE_SIGN_ENTITLEMENTS: LLMTokenBar/LLMTokenBar.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        PRODUCT_NAME: "LLM Token Bar"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
  LLMTokenBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LLMTokenBarTests
    dependencies:
      - target: LLMTokenBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llmtokenbar.appTests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LLM Token Bar.app/Contents/MacOS/LLM Token Bar"
        BUNDLE_LOADER: "$(TEST_HOST)"
